# Uncomment the following line to enable the Sofle OLED Display
# CONFIG_ZMK_DISPLAY=y

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y



CONFIG_ZMK_KEYBOARD_NAME="SofleChoc"

CONFIG_ZMK_STUDIO=yes


CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=9000000

# Uncomment this line below to add rgb underglow / backlight support
# CONFIG_ZMK_RGB_UNDERGLOW=y

# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Linux Bluetooth connection stability fixes
# BlueZ (Linux BT stack) drops GATT subscriptions on reconnect/sleep-wake;
# without this, ZMK silently stops sending HID reports until you re-pair.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Allow overwriting existing bonds without needing to clear them first —
# helps Linux reconnect cleanly after sleep without manual re-pairing.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# Tighter connection intervals so Linux re-establishes the link faster
# after wake. Values are in units of 1.25ms (6=7.5ms, 12=15ms).
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# Raise supervision timeout so a brief RF gap during wake doesn't
# immediately drop the connection (value in units of 10ms, 400=4s).
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
